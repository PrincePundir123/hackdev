<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00264d" />
    <title>Saathi Care</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font:
          17px/1.7 system-ui,
          sans-serif;
        color: #00264d;
        background: #f2f9f9;
      }
      main {
        max-width: 560px;
        padding: 40px;
        background: white;
        border: 1px solid #dce7ed;
        border-radius: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.4;
      }
      p {
        color: #4e687e;
      }
      button {
        background: #facf80;
        color: #00264d;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 30px;
        padding: 12px 24px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #006669;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 25px;
        color: #4e687e;
      }
      @media (max-width: 480px) {
        main {
          padding: 26px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="heading"></h1>
      <p id="message"></p>
      <p id="privacy"></p>
      <button id="retry" type="button"></button>
      <small id="footnote"></small>
    </main>
    <script>
      const messages = __PWA_MESSAGES__;
      let language = 'en';
      try {
        language = localStorage.getItem('saathi:language') || 'en';
      } catch {}
      const copy = messages[language] || messages.en;
      document.documentElement.lang = messages[language] ? language : 'en';
      document.documentElement.dir = copy.dir;
      for (const id of ['heading', 'message', 'privacy', 'retry', 'footnote']) {
        document.getElementById(id).textContent = copy[id];
      }
      document.title = copy.heading + ' | Saathi Care';
      document.getElementById('retry').addEventListener('click', () => location.reload());
    </script>
  </body>
</html>
